name: Auto Sync and Deploy

on:
  schedule:
    - cron: "30 23 * * *"   # 每天北京时间 07:30 自动同步上游并部署
  workflow_dispatch:

concurrency:
  group: sync-deploy
  cancel-in-progress: false

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          set -euo pipefail
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git remote add upstream https://github.com/imzyb/MiSub.git || git remote set-url upstream https://github.com/imzyb/MiSub.git
          git fetch upstream main
          if git merge upstream/main --no-edit; then
            echo "✅ 已合并上游最新代码"
          else
            echo "⚠️ 合并冲突，回退为上游版本并保留部署配置文件"
            git merge --abort || true
            mkdir -p /tmp/keep
            cp .github/workflows/auto-deploy.yml /tmp/keep/
            cp wrangler.toml /tmp/keep/
            git reset --hard upstream/main
            cp /tmp/keep/auto-deploy.yml .github/workflows/auto-deploy.yml
            cp /tmp/keep/wrangler.toml wrangler.toml
            git add .github/workflows/auto-deploy.yml wrangler.toml
            git commit -m "chore: 保留部署工作流与 wrangler 配置"
          fi
          git push origin main || echo "::warning::推送 fork 失败（上游可能改动了 workflow 文件），本次跳过同步，继续部署最新合并结果"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
